name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint and unit tests
        run: ./gradlew :heatmap:build --stacktrace

      # :sample is the module anyone evaluating this library reads and copies from, and nothing
      # ever compiled it. A library can stay green while the only worked example of how to use it
      # no longer builds against its own current API — which is the version people would hit first.
      - name: Build the sample app
        run: ./gradlew :sample:assembleDebug :sample:lintDebug --stacktrace
